services:
  mysql8:
    image: mysql:8.0.41
    ports:
      - "53306:3306"
    environment:
      MYSQL_DATABASE: game2048
      MYSQL_USER: game2048
      MYSQL_PASSWORD: game2048
      MYSQL_ROOT_PASSWORD: game2048-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugame2048 -pgame2048"]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      UPLOAD_LIMIT: 300M
    links:
      - mysql8:db
    ports:
      - "50000:80"

  mockserver:
    image: mockserver/mockserver:5.13.2
    platform: linux/amd64
    ports:
      - "51081:1080"
    environment:
      MOCKSERVER_LOG_LEVEL: WARN

  playwright:
    build: 
      context: .
      dockerfile: docker/playwright/Dockerfile
    ports:
      - "53000:3000"
    command: ["npx", "playwright", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    environment:
      DISPLAY: web-driver.tool.net:99.0
    depends_on:
      web-driver:
        condition: service_started
    networks:
      default:
        aliases:
          - playwright.tool.net

  web-driver:
    image: selenium/standalone-chromium:latest
    ports:
      # - "14444:4444"
      - "57900:7900"
    shm_size: 2gb
    networks:
      default:
        aliases:
          - web-driver.tool.net
